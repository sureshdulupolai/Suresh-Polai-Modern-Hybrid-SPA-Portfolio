{% extends 'custom_admin/base_admin.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow max-w-md mx-auto p-6 text-center">
    <div class="mb-4">
        <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                </path>
            </svg>
        </div>
        <h3 class="text-xl font-bold text-gray-800 mb-2">Delete Project?</h3>
        <p class="text-gray-600">Are you sure you want to delete <span class="font-semibold">"{{ project.title
                }}"</span>? This action cannot be undone.</p>
    </div>

    <form method="post" class="flex justify-center space-x-4">
        {% csrf_token %}
        <a href="{% url 'admin_projects' %}"
            class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-6 rounded transition-colors">
            Cancel
        </a>
        <button type="submit"
            class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-6 rounded shadow transition-colors">
            Confirm Delete
        </button>
    </form>
</div>
{% endblock %}
