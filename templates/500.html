{% extends 'base.html' %}

{% block content %}
<div class="pt-32 pb-4 flex items-center justify-center relative overflow-hidden">
    <!-- Background Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-red-600/10 dark:bg-red-600/20 rounded-full blur-[120px] z-0"></div>

    <div class="relative z-10 text-center px-4">
        <div class="mb-6 flex justify-center">
            <svg class="w-24 h-24 text-red-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                </path>
            </svg>
        </div>

        <h1 class="text-5xl font-bold text-gray-900 dark:text-white mb-4">Something Went Wrong</h1>
        <p class="text-gray-600 dark:text-gray-400 text-lg mb-8 max-w-md mx-auto">
            Our servers encountered an unexpected issue. We've logged it and our team is looking into it.
        </p>

        <a href="/" data-link
            class="inline-block px-8 py-3 rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-white font-bold hover:bg-gray-50 dark:hover:bg-gray-700 transition-all duration-300 shadow-sm">
            Return Home
        </a>
    </div>
</div>
{% endblock %}
