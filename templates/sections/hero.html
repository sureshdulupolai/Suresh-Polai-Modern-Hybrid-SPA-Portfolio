{% load static %}
<section id="hero"
    class="relative min-h-[75vh] md:min-h-[80vh] flex items-center justify-center overflow-hidden pt-16 md:pt-20">
    <!-- Overlay Gradient -->
    <div
        class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent dark:from-dark/50 dark:to-dark z-0 pointer-events-none">
    </div>

    <div class="container mx-auto px-6 relative z-10 text-center md:text-left grid md:grid-cols-2 gap-12 items-center">
        <!-- Text Content -->
        <div class="space-y-8 animate-fade-in-up">
            <div class="inline-block px-4 py-2 rounded-full glass border-primary/20 backdrop-blur-md">
                <span class="text-primary font-medium tracking-wide text-sm uppercase">Available for work</span>
            </div>

            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight leading-tight">
                Building <span
                    class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">Digital</span> <br>
                <span id="typing-text"
                    class="text-gray-800 dark:text-white border-r-4 border-primary pr-2">Experiences.</span>
            </h1>

            <p class="text-xl text-gray-600 dark:text-gray-400 max-w-lg mx-auto md:mx-0 leading-relaxed">
                I help startups and enterprises build scalable, high-performance web applications with modern
                technologies.
            </p>

            <div
                class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-6 justify-center md:justify-start pt-4">
                <a href="/projects" data-link
                    class="group relative px-8 py-4 bg-primary text-white rounded-full font-bold shadow-lg hover:shadow-primary/50 transition-all transform hover:-translate-y-1 overflow-hidden">
                    <span class="relative z-10">View Work</span>
                    <div
                        class="absolute inset-0 h-full w-full bg-secondary scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-500">
                    </div>
                </a>

                <a href="/contact" data-link
                    class="px-8 py-4 glass text-gray-800 dark:text-white rounded-full font-bold hover:bg-white/20 transition-all border border-gray-200 dark:border-gray-700 hover:border-primary/50">
                    Contact Me
                </a>
            </div>

            <div class="pt-10 flex items-center justify-center md:justify-start space-x-8 text-gray-500">
                <div class="text-center">
                    <h3 class="text-2xl font-bold text-gray-800 dark:text-white">30+</h3>
                    <p class="text-xs uppercase tracking-wider">Projects</p>
                </div>
                <div class="w-px h-10 bg-gray-300 dark:bg-gray-700"></div>
                <div class="text-center">
                    <h3 class="text-2xl font-bold text-gray-800 dark:text-white">100%</h3>
                    <p class="text-xs uppercase tracking-wider">Satisfaction</p>
                </div>
            </div>
        </div>

        <!-- Visual / 3D Placeholder Interaction Area -->
        <div class="relative hidden md:block h-[500px] w-full animate-float">
            <!-- This area interacts with the background 3D scene subtly -->
            <div class="absolute inset-0 flex items-center justify-center">
                <div
                    class="w-64 h-64 rounded-full bg-gradient-to-tr from-primary to-secondary opacity-20 blur-3xl animate-pulse-glow">
                </div>
            </div>
            <!-- Glass Card Floating -->
            <div
                class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 glass p-8 rounded-2xl w-80 shadow-2xl border-t border-white/50">
                <div class="flex items-center space-x-4 mb-6">
                    <div
                        class="w-12 h-12 rounded-full bg-black dark:bg-white overflow-hidden flex items-center justify-center border border-gray-200 dark:border-gray-600">
                        <img src="{% static 'images/logo_wbg.png' %}" alt="Avatar" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h4 class="font-bold text-gray-800 dark:text-white">Suresh Polai</h4>
                        <p class="text-xs text-primary">Full Stack Developer</p>
                    </div>
                </div>
                <div class="space-y-3">
                    <div class="h-2 bg-gray-200 dark:bg-gray-700 rounded w-3/4"></div>
                    <div class="h-2 bg-gray-200 dark:bg-gray-700 rounded w-full"></div>
                    <div class="h-2 bg-gray-200 dark:bg-gray-700 rounded w-1/2"></div>
                </div>
                <div class="mt-6 flex justify-between items-center">
                    <div class="flex -space-x-2">
                        <div class="w-8 h-8 rounded-full bg-blue-500 border-2 border-white dark:border-dark"></div>
                        <div class="w-8 h-8 rounded-full bg-purple-500 border-2 border-white dark:border-dark"></div>
                        <div class="w-8 h-8 rounded-full bg-green-500 border-2 border-white dark:border-dark"></div>
                    </div>
                    <span class="text-xs text-gray-500">Latest Commit: Now</span>
                </div>
            </div>
        </div>
    </div>

</section>

<script>
    // Typing Effect Logic
    const texts = ["Experiences.", "Solutions.", "Products.", "Futures."];
    let count = 0;
    let index = 0;
    let currentText = "";
    let letter = "";

    (function type() {
        if (count === texts.length) {
            count = 0;
        }
        currentText = texts[count];
        letter = currentText.slice(0, ++index);

        const typingElement = document.getElementById("typing-text");
        if (typingElement) {
            typingElement.textContent = letter;
            if (letter.length === currentText.length) {
                setTimeout(() => {
                    deleteText();
                }, 2000); // Wait before deleting
                return;
            }
        }
        setTimeout(type, 100);
    }());

    function deleteText() {
        if (index > 0) {
            currentText = texts[count];
            letter = currentText.slice(0, --index);
            const typingElement = document.getElementById("typing-text");
            if (typingElement) typingElement.textContent = letter;
            setTimeout(deleteText, 50);
        } else {
            count++;
            setTimeout(() => {
                // Re-call type, normally needs to be in scope or separate function to avoid issues
                // For simplicity in this script tag we just restart the loop logic
                (function type() {
                    if (count === texts.length) {
                        count = 0;
                    }
                    currentText = texts[count];
                    letter = currentText.slice(0, ++index);

                    const typingElement = document.getElementById("typing-text");
                    if (typingElement) {
                        typingElement.textContent = letter;
                        if (letter.length === currentText.length) {
                            setTimeout(() => {
                                deleteText();
                            }, 2000);
                            return;
                        }
                    }
                    setTimeout(type, 100);
                }());
            }, 500);
        }
    }
</script>
