<section id="experience" class="min-h-screen py-24 bg-gray-50 dark:bg-dark/50">
    <div class="container mx-auto px-6 max-w-5xl">
        <h2 class="text-4xl md:text-5xl font-bold text-center mb-16 dark:text-white animate-fade-in-up">Experience
            Journey</h2>

        <div class="relative space-y-12">
            <!-- Central Line -->
            <div class="absolute left-4 md:left-1/2 top-0 bottom-0 w-0.5 bg-gray-200 dark:bg-gray-800 -translate-x-1/2">
            </div>

            {% for exp in experiences %}
            <div class="relative flex flex-col md:flex-row items-center justify-between group animate-fade-in-up"
                style="animation-delay: {{ forloop.counter0 }}00ms;">

                <!-- Dot -->
                <div
                    class="absolute left-4 md:left-1/2 w-4 h-4 bg-primary rounded-full border-4 border-white dark:border-dark -translate-x-1/2 z-10 shadow-lg group-hover:scale-125 transition-transform">
                </div>

                <!-- Date (Left for odd, Right for even on desktop) -->
                <div
                    class="ml-12 md:ml-0 md:w-[45%] {% if forloop.counter|divisibleby:2 %}md:order-1 md:text-right{% else %}md:order-3 md:text-left{% endif %} mb-2 md:mb-0">
                    <span
                        class="inline-block px-4 py-1 rounded-full bg-primary/10 text-primary text-sm font-semibold border border-primary/20">
                        {{ exp.start_date|date:"M Y" }} - {% if exp.end_date %}{{ exp.end_date|date:"M Y" }}{% else
                        %}Present{% endif %}
                    </span>
                </div>

                <!-- Content Card (Right for odd, Left for even on desktop) -->
                <div
                    class="ml-12 md:ml-0 md:w-[45%] {% if forloop.counter|divisibleby:2 %}md:order-3{% else %}md:order-1{% endif %} glass p-6 rounded-xl hover:shadow-lg transition-shadow border-l-4 border-primary">
                    <h3 class="text-xl font-bold text-gray-800 dark:text-white">{{ exp.role }}</h3>
                    <h4 class="text-lg text-primary font-medium mb-2">{{ exp.company }}</h4>
                    <p class="text-gray-600 dark:text-gray-400 text-sm leading-relaxed">
                        {{ exp.description }}
                    </p>
                </div>

            </div>
            {% endfor %}
        </div>
    </div>
</section>
