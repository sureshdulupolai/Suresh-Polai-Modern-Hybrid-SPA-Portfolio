{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Background Glow -->
    <div class="absolute inset-0 bg-dark z-0"></div>
    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px]">
    </div>

    <div class="relative z-10 text-center px-4">
        <h1
            class="text-9xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-600 mb-4 animate-float">
            404</h1>
        <h2 class="text-3xl font-bold text-white mb-6">Page Not Found</h2>
        <p class="text-gray-400 text-lg mb-8 max-w-md mx-auto">
            The page you're looking for seems to have wandered off into the digital void.
        </p>

        <a href="/" data-link
            class="inline-block px-8 py-3 rounded-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold shadow-lg shadow-purple-500/30 hover:shadow-purple-500/50 hover:scale-105 transition-all duration-300">
            Back to Home
        </a>
    </div>
</div>
{% endblock %}
