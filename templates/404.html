{% extends 'base.html' %}

{% block content %}
<div class="pt-32 pb-4 flex items-center justify-center relative overflow-hidden">
    <div class="relative z-10 text-center px-4">
        <h1 class="text-9xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary mb-4 animate-float">
            404
        </h1>
        <h2 class="text-3xl font-bold text-gray-900 dark:text-white mb-6">Page Not Found</h2>
        <p class="text-gray-600 dark:text-gray-400 text-lg mb-8 max-w-md mx-auto">
            The page you're looking for seems to have wandered off into the digital void.
        </p>

        <a href="/" data-link
            class="inline-block px-8 py-3 rounded-full bg-gradient-to-r from-primary to-secondary text-white font-bold shadow-lg shadow-primary/20 hover:shadow-primary/40 dark:shadow-purple-500/30 dark:hover:shadow-purple-500/50 hover:scale-105 transition-all duration-300">
            Back to Home
        </a>
    </div>
</div>
{% endblock %}
